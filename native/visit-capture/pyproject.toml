[project]
name = "local-voice-collector"
version = "0.10.0"
description = "Private, local-first speech segment collector"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sounddevice>=0.5,<1",
  "numpy>=1.26,<3",
  "silero-vad>=6.0,<7",
  "onnxruntime>=1.20,<2",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["voice_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
