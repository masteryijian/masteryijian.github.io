<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPC 客户工作台 · CRM v2</title><link rel="stylesheet" href="./styles.css?v=20261016-2"></head><body><div class="layout"><aside><a class="logo" href="../../index.html">OPC <span>Business Desk</span></a><p class="caption">客户关系 · 清楚推进</p><nav aria-label="CRM 导航"><button data-view="overview" class="active">工作概览</button><button data-view="customers">客户档案</button><button data-view="followups">跟进计划</button><button data-view="research">研究线索</button><button data-view="briefs">周报草稿</button><button data-view="backup">备份与迁移</button></nav><div class="aside-bottom"><a href="../index.html">全部工具 ↗</a><a href="../../index.html">返回官网 ↗</a><small>CRM v2 · 2026-10-16</small></div></aside><main><header><div><p class="eyebrow">OPC TECHBRIDGE / WORKSPACE</p><h1 id="viewTitle">工作概览</h1></div><button id="newCustomer">＋ 新建客户</button></header><p class="notice">本机工作台：资料只保存在当前浏览器，不会上传。请定期导出备份；换设备不会自动同步。</p><p id="status" role="status" aria-live="polite"></p><section id="content"></section><footer>行业情报与客户周报默认周一 09:00（柏林时间）。此网页只管理草稿，尚未连接自动发信服务。</footer></main></div>
<dialog id="editor"><form id="customerForm"><div class="dialog-head"><h2 id="editorTitle">新建客户</h2><button type="button" id="closeEditor" class="icon" aria-label="关闭">×</button></div><input name="id" type="hidden"><div class="form-grid"><label>公司 / 机构<input name="company" required maxlength="200" autocomplete="organization"></label><label>记录类型<select name="kind"><option value="customer">客户档案</option><option value="research">研究线索（需求未确认）</option></select></label><label>联系人<input name="contact" maxlength="200" autocomplete="name"></label><label>邮箱<input name="email" type="email" maxlength="254" autocomplete="email"></label><label>行业<input name="sector" maxlength="200"></label><label>销售阶段<select name="stage"><option value="lead">新线索</option><option value="qualified">需求已确认</option><option value="proposal">方案 / 报价</option><option value="won">已成交</option><option value="lost">已关闭</option></select></label><label>下次跟进<input name="nextDate" type="date"></label><label>下一步行动<input name="nextAction" maxlength="500" placeholder="如：确认设备接口与评估负责人"></label><label class="wide">公开来源 / 证据<input name="source" maxlength="2000" placeholder="官网链接、访谈日期或资料名称"></label><label class="wide">需求 / 备注<textarea name="notes" rows="4" maxlength="10000"></textarea></label></div><div class="dialog-actions"><button type="button" id="cancelEditor" class="secondary">取消</button><button>保存记录</button></div></form></dialog>
<input id="importFile" type="file" accept="application/json,.json" hidden><script src="./model.js?v=20261016-2"></script><script src="./app.js?v=20261016-3"></script></body></html>
